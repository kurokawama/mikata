name: OSV Scanner (Dependencies CVE)

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  schedule:
    # 毎週月曜 03:30 JST
    - cron: '30 18 * * 0'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  osv-scan:
    name: OSV-Scanner (Google)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.1
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=sarif
            --output=osv-results.sarif
            ./
        continue-on-error: true

      - name: Run OSV-Scanner (JSON for gating)
        run: |
          # 依存CVEを JSON で取得して Critical/High を集計
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            --recursive --format=json /src > osv-results.json || true

          CRIT=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.database_specific.severity == "CRITICAL" or .severity[]?.score == "CRITICAL")] | length' osv-results.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.database_specific.severity == "HIGH" or .severity[]?.score == "HIGH")] | length' osv-results.json 2>/dev/null || echo 0)
          echo "Critical CVE: $CRIT / High CVE: $HIGH"
          echo "osv_critical=$CRIT" >> $GITHUB_OUTPUT
          echo "osv_high=$HIGH" >> $GITHUB_OUTPUT

          # Critical があれば fail
          if [[ "$CRIT" -gt 0 ]]; then
            echo "::error::OSV-Scanner detected $CRIT Critical CVEs"
            exit 1
          fi
        id: osv-json

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-results
          path: osv-results.json
          retention-days: 30
