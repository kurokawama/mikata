name: Semgrep Security Scan

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  schedule:
    # 毎週月曜 03:00 JST (= 18:00 UTC 日曜)
    - cron: '0 18 * * 0'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Semgrep OSS Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/nextjs \
            --config=p/typescript \
            --config=p/react \
            --sarif \
            --output=semgrep-results.sarif \
            --json \
            --json-output=semgrep-results.json \
            --severity=ERROR \
            --severity=WARNING \
            --timeout=300 \
            --max-memory=4000 || SEMGREP_EXIT=$?

          # Criticalが1件でもあれば fail
          CRITICAL=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          echo "Critical findings: $CRITICAL"
          if [[ "$CRITICAL" -gt 0 ]]; then
            echo "::error::Semgrep detected $CRITICAL Critical findings"
            exit 1
          fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
